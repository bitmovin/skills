# Parameter file consumed by the Jinja templates in ../templates/.
# Copy to your working dir and edit. Never put credentials in here.

# --- required for every template -------------------------------------------
encodingName: my-live-test
# Cloud region. Always set explicitly. Examples:
#   AWS_EU_WEST_1, AWS_US_EAST_1, AWS_AP_SOUTHEAST_1
#   GOOGLE_EUROPE_WEST_1, GOOGLE_US_CENTRAL_1
#   AZURE_EUROPE_WEST
cloudRegion: AWS_EU_WEST_1

# Output created in advance via `bitmovin encoding outputs create s3` /
# `... create gcs`, or picked from `bitmovin encoding outputs list`.
outputId: 00000000-0000-0000-0000-000000000000

# Path prefix inside the output bucket. Trailing slash optional; the
# templates normalize it to exactly one separator before child paths.
outputBasePath: live/my-live-test/

# Stream key the user will push with. RTMP scenarios only — SRT ingest is
# identified by host/port and has no stream-key concept. 3-20 chars,
# [a-zA-Z0-9]. Globally unique within the Bitmovin organization.
#
# Only set this when `streamKeyMode: Use my own` is picked at runtime
# (Step 4 of SKILL.md). In that case the skill workflow pre-creates or
# reuses this stream key via `POST /encoding/live/stream-keys` (Step 4b)
# and writes the returned concrete UUID(s) into the *StreamKeyId params
# below — the Jinja templates ASSIGN those UUIDs.
#
# When `streamKeyMode: Auto-generate` is picked, omit `streamKey` and
# the *StreamKeyId params entirely. The templates fall back to
# `streamKeyConfiguration: { type: GENERATE }` and the API mints random
# keys, surfaced via `bitmovin encoding jobs live` once RUNNING.
streamKey: bitmovin

# UUID of the pre-created stream key for `rtmp` scenarios. Populated by
# Step 4b at runtime; do not hand-edit. Omit (or leave unset) for
# auto-generated mode.
mainStreamKeyId: 00000000-0000-0000-0000-000000000000

# UUIDs for `redundant-rtmp` scenarios (primary + backup). Populated by
# Step 4b at runtime; the backup key's value is auto-derived as
# `<streamKey>-backup`. Omit for auto-generated mode.
primaryStreamKeyId: 00000000-0000-0000-0000-000000000000
backupStreamKeyId: 00000000-0000-0000-0000-000000000000

# --- optional, with defaults -----------------------------------------------
segmentLength: 4.0
manifests: [dash, hls]      # any subset of [dash, hls]

videoLadder:
  - { height: 720, bitrate: 3000000 }
  - { height: 480, bitrate: 1600000 }
  - { height: 240, bitrate: 800000 }

audioBitrate: 128000

# encoderVersion: STABLE (default) or BETA
encoderVersion: STABLE

autoShutdownStreamTimeoutMin: 30
autoShutdownBytesReadTimeoutSec: 30

# ACL applied to manifests and segments in the output bucket.
# - PUBLIC_READ: world-readable HTTPS URLs (handy for demos/tests).
#   Default if omitted.
# - PRIVATE: provider treats them as private; consumers need signed URLs.
# - NONE: omit the acl block entirely; provider's bucket-level default
#   applies (use this for buckets with object-ownership policies that
#   forbid per-object ACLs, e.g. S3 buckets with ACLs disabled).
outputAcl: PUBLIC_READ

# --- SRT template only -----------------------------------------------------
# srtMode: CALLER          # or LISTENER
# srtHost: ingest.example  # required only for CALLER mode
# srtPort: 2088            # 2088/2089/2090/2091 in LISTENER mode
# srtPath: live
# srtLatencyMs: 2000
# Optional AES passphrase for the SRT input. Must be exactly 16 chars
# (AES-128) or 32 chars (AES-256); the template infers keyLength from
# the length. Omit for an unencrypted SRT stream.
# srtPassphrase: 0123456789abcdef
