name = "bitmovin-skill"
main = "src/index.js"
compatibility_date = "2026-04-01"
workers_dev = false

# Bundle SKILL.md as text into the Worker at build time. The canonical
# source lives at skills/bitmovin/SKILL.md and is imported via relative path.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Routes are commented out by default — uncomment and adjust the zone after
# the worker is created in the Cloudflare account.
#
# [[routes]]
# pattern = "bitmovin.com/skill"
# zone_name = "bitmovin.com"
#
# [[routes]]
# pattern = "bitmovin.com/skill/*"
# zone_name = "bitmovin.com"
#
# [[routes]]
# pattern = "bitmovin.com/skill.md"
# zone_name = "bitmovin.com"

[observability]
enabled = true

[placement]
mode = "smart"
